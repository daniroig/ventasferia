<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b63">
<title>Registro de libros</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Diseño: una columna estrecha, cámara arriba, entrada manual y último registro debajo, pestañas abajo. */
  :root {
    --bg: #f3f6f6;
    --surface: #ffffff;
    --fg: #15201f;
    --muted: #5b6b69;
    --line: #d5dfdd;
    --accent: #0b6b63;
    --accent-fg: #ffffff;
    --ok: #1c7a3d;
    --danger: #b3261e;
    --cam-bg: #0c1413;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1514;
      --surface: #172120;
      --fg: #e6efed;
      --muted: #93a6a3;
      --line: #2a3a38;
      --accent: #4fc3b5;
      --accent-fg: #06201d;
      --ok: #6fd08c;
      --danger: #ff8a80;
      --cam-bg: #050a09;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.4 var(--font);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding-block: 14px 10px;
  }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: .01em; }
  .ver { font-size: .7rem; font-weight: 400; color: var(--muted); letter-spacing: .04em; margin-left: 4px; }
  .pill {
    font-variant-numeric: tabular-nums;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 12px; font-size: .9rem; color: var(--muted);
  }
  .pill b { color: var(--fg); }

  .cam {
    position: relative; aspect-ratio: 8 / 3; max-width: 100%;
    background: var(--cam-bg); border-radius: 10px; overflow: hidden;
    border: 2px solid transparent; transition: border-color .15s;
  }
  .cam.hit { border-color: var(--ok); }
  .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .guide {
    position: absolute; left: 10%; right: 10%; top: 50%; height: 0;
    border-top: 2px solid rgba(255, 90, 80, .85); pointer-events: none;
  }
  .cam-empty {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center;
    color: #cfe0dd;
  }
  .cam-empty p { margin: 0; font-size: .9rem; max-width: 30ch; }

  .btn {
    font: inherit; font-weight: 600; min-height: 48px; padding: 0 18px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    color: var(--fg); cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: .9rem; }
  .btn:focus-visible, input:focus-visible, .tabs button:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }

  .stack { display: flex; flex-direction: column; gap: 14px; padding-block: 12px 24px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  label { font-size: .85rem; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .inline { display: flex; gap: 8px; align-items: center; }
  input[type="text"] {
    font: inherit; min-height: 48px; padding: 0 12px; border-radius: 8px; min-width: 0; flex: 1;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  input.mono { font-family: var(--mono); letter-spacing: .12em; font-size: 1.15rem; }
  .unit { color: var(--muted); }
  .err { color: var(--danger); margin: 0; min-height: 1.2em; font-size: .9rem; }
  .muted { color: var(--muted); font-size: .9rem; margin: 0; }

  .last .kind, .pending .kind { margin: 0; font-size: .8rem; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .last .val, .pending .val { margin: 0; font-family: var(--mono); font-size: 1.4rem; letter-spacing: .06em; word-break: break-all; }
  .last .note { margin: 0; color: var(--ok); font-size: .9rem; min-height: 1.2em; }
  .isbn-row { display: flex; gap: 8px; align-items: center; }
  .isbn-actions { display: flex; flex-direction: column; gap: 6px; width: 104px; flex: none; }
  .isbn-actions .btn { width: 100%; padding: 0 8px; }
  input.isbn { letter-spacing: .04em; font-size: 1.05rem; }
  #isbnCard .note { margin: 0; color: var(--muted); font-size: .9rem; }
  #isbnCard .note:empty { display: none; }
  .btn:disabled { opacity: .45; cursor: default; }

  dialog {
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px; width: min(360px, calc(100% - 32px));
  }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog h2 { margin: 0 0 6px; font-size: 1.1rem; }
  dialog p { margin: 0 0 16px; color: var(--muted); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
  .toolbar .btn { flex: 1 1 180px; }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.list li {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center;
  }
  li .main { font-family: var(--mono); font-size: 1.02rem; letter-spacing: .04em; min-width: 0; overflow-wrap: anywhere; }
  li .tag { font-family: var(--font); font-size: .75rem; color: var(--muted); letter-spacing: .05em; margin-right: 6px; }
  li .meta { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  li .price { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  li .del { grid-row: 1 / span 2; grid-column: 2; justify-self: end; }
  li .price + .del { grid-row: 2; }
  .empty { text-align: center; color: var(--muted); padding: 28px 8px; }

  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-inline: env(safe-area-inset-left, 0px) env(safe-area-inset-right, 0px);
  }
  nav.tabs button {
    flex: 1; min-height: 56px; font: inherit; font-weight: 600; background: none; border: 0;
    color: var(--muted); cursor: pointer; border-top: 3px solid transparent;
  }
  nav.tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }

  #toast {
    position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); background: var(--fg); color: var(--bg);
    padding: 10px 16px; border-radius: 8px; font-size: .92rem; max-width: calc(100% - 32px);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Registro de libros <small class="ver">v4</small></h1>
    <span class="pill"><b id="count">0</b> registros</span>
  </header>

  <section id="view-entry" class="stack">
    <div class="cam" id="cam">
      <video id="video" playsinline muted></video>
      <div class="guide" id="guide" hidden></div>
      <div class="cam-empty" id="camEmpty">
        <p id="camMsg">Apunta al código de barras del libro (empieza por 978 o 979).</p>
      </div>
    </div>
    <button type="button" class="btn primary" id="btnCam" style="width:100%">Activar cámara</button>

    <div class="card" id="isbnCard">
      <label for="isbnField">ISBN escaneado</label>
      <div class="isbn-row">
        <input type="text" class="mono isbn" id="isbnField" readonly placeholder="Sin escanear" autocomplete="off">
        <div class="isbn-actions">
          <button type="button" class="btn primary" id="btnAdd" disabled>Añadir</button>
          <button type="button" class="btn small" id="btnDiscard" disabled>Descartar</button>
        </div>
      </div>
      <p class="note" id="isbnNote"></p>
    </div>

    <form class="card" id="manualForm" autocomplete="off">
      <label for="code">Código manual de 6 dígitos</label>
      <div class="inline">
        <input type="text" class="mono" id="code" inputmode="numeric" maxlength="6" placeholder="000000">
        <button type="submit" class="btn primary">Añadir</button>
      </div>
      <p class="err" id="manualErr" role="alert"></p>
    </form>

    <div class="card last" id="last" hidden>
      <p class="kind" id="lastKind">Último registro</p>
      <p class="val" id="lastVal"></p>
      <p class="muted" id="lastMeta"></p>
      <p class="note" id="lastNote"></p>
      <label for="lastPrice">Precio (opcional)</label>
      <div class="inline">
        <input type="text" id="lastPrice" inputmode="decimal" placeholder="0,00" autocomplete="off">
        <span class="unit">€</span>
      </div>
      <p class="err" id="priceErr" role="alert"></p>
      <button type="button" class="btn danger small" id="lastDelete">Eliminar este registro</button>
    </div>
  </section>

  <section id="view-list" class="stack" hidden>
    <div class="toolbar">
      <button type="button" class="btn primary" id="btnXlsx">Exportar a Excel (.xlsx)</button>
      <button type="button" class="btn" id="btnCsv">Exportar a CSV</button>
    </div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="emptyMsg">Aún no hay libros registrados.</p>
    <button type="button" class="btn danger small" id="btnClear" hidden>Borrar todos los registros</button>
  </section>
</div>

<dialog id="confirmClear" aria-labelledby="cTitle">
  <h2 id="cTitle">¿Borrar todos los registros?</h2>
  <p id="cText">Esta acción no se puede deshacer.</p>
  <div class="inline">
    <button type="button" class="btn primary" id="clearNo" autofocus style="flex:1">No</button>
    <button type="button" class="btn danger" id="clearYes" style="flex:1">Sí, borrar</button>
  </div>
</dialog>

<nav class="tabs" aria-label="Secciones">
  <button type="button" data-view="entry" aria-current="page">Entrada</button>
  <button type="button" data-view="list">Registros</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
